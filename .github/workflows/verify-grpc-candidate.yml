name: Verify patched preview transitive dependency
on:
  push:
    branches:
      - security/preview-dependency-refresh-20261116
    paths:
      - package.json
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/preview-dependency-refresh-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Re-resolve npm lockfile with patched grpc
        run: |
          npm install --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): lock patched grpc transport dependency"
            git push origin HEAD:refs/heads/security/preview-dependency-refresh-20261116
          fi
      - name: Production and complete dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: UI and business unit tests
        if: always()
        run: npm test
      - name: Firestore permission emulator
        if: always()
        run: npm run test:emulator
