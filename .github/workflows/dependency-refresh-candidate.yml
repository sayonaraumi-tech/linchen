name: Isolated preview dependency refresh candidate
on:
  push:
    branches:
      - feature/desktop-ui-v1-20261114
    paths:
      - .github/workflows/dependency-refresh-candidate.yml
permissions:
  contents: write
jobs:
  create-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/desktop-ui-v1-20261114
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refresh development dependencies in an isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c security/preview-dependency-refresh-20261116
          npm install --no-audit --no-fund
          npm install --save-dev --no-audit --no-fund playwright@latest @firebase/rules-unit-testing@latest firebase@latest firebase-tools@latest
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package updates proposed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore(security): propose latest preview test dependencies and lockfile"
          git push origin HEAD:refs/heads/security/preview-dependency-refresh-20261116
          echo "Candidate branch pushed; not merged or deployed." >> "$GITHUB_STEP_SUMMARY"
      - name: Scan production-only and development dependencies
        if: always()
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Validate business and UI contracts
        if: always()
        run: npm test
      - name: Validate Firestore emulator permissions
        if: always()
        run: npm run test:emulator
