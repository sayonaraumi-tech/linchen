name: New accounting core dependency patch acceptance
on:
  push:
    branches:
      - security/core-dependency-patch-20261116
    paths:
      - package.json
      - tests/firestore-rules.test.cjs
      - .github/workflows/core-dependency-patch.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/core-dependency-patch-20261116
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve locked dependencies with patched grpc
        run: |
          npm install --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): lock patched core accounting dependency tree"
            git push origin HEAD:refs/heads/security/core-dependency-patch-20261116
          fi
      - name: Runtime and full dependency audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Accounting business regression
        if: always()
        run: npm test
      - name: Firestore emulator permission regression
        if: always()
        run: npm run test:rules
