name: Independent new-system dependency security
on:
  push:
    branches:
      - develop/tsukinowa-construction
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all development and production dependencies
        run: npm audit --audit-level=high
