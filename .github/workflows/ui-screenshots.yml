name: Nine-page UI browser screenshots
on:
  push:
    branches: [ui/plan-b-nine-pages]
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Capture real UI screenshots
        run: node scripts/capture-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-ui-real-screenshots
          path: screenshots/
          retention-days: 7
