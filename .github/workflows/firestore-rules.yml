name: Isolated Firestore security
on:
  push:
    branches: [develop/tsukinowa-construction]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'src/storage/**'
      - 'tests/firestore-rules.test.cjs'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
permissions:
  contents: read
jobs:
  security-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install isolated test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify tenant and audit rules in disposable emulator
        run: npm run test:rules
