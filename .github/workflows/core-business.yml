name: Independent business core
on:
  push:
    branches: [develop/tsukinowa-construction]
  pull_request:
permissions:
  contents: read
jobs:
  core-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core accounting regression
        run: node --test tests/core-business.test.cjs tests/views.test.cjs tests/sandbox.test.cjs tests/advanced-accounting.test.cjs tests/document-lifecycle.test.cjs tests/firestore-gateway.test.cjs tests/calendar-adapter.test.cjs tests/document-numbering.test.cjs tests/bank-import.test.cjs tests/outbox.test.cjs tests/frozen-pdf.test.cjs tests/schedule-calendar.test.cjs tests/platform-settlement.test.cjs
