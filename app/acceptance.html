<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月輪合同会社｜財務管理</title>
<link rel="stylesheet" href="/app/workbench.css">
<link rel="stylesheet" href="/app/acceptance.css">
</head>
<body>
<header class="app-header">
  <strong>月輪合同会社</strong>
  <label>テーマ<select id="theme"><option value="blue">霧青</option><option value="gold">黒曜金</option><option value="green">松緑</option><option value="purple">煙紫</option><option value="dark">深夜</option></select></label>
  <button id="sign-out" hidden>ログアウト</button>
</header>
<main>
  <section id="login">
    <h1>財務管理 ログイン</h1>
    <form id="sign-in">
      <label>メールアドレス<input name="email" type="email" autocomplete="username" required></label>
      <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">ログイン</button>
    </form>
    <button id="password-reset" type="button" hidden>初回設定・パスワード再設定</button>
    <form id="mfa-sign-in" hidden>
      <label>認証アプリのコード<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label>
      <button type="submit">認証を完了</button>
    </form>
  </section>
  <section id="mfa-enrollment" hidden>
    <h2>管理者の二段階認証</h2>
    <button id="verify-email" type="button" hidden>確認メールを送信</button>
    <button id="start-enrollment" type="button" hidden>認証アプリを設定</button>
    <form id="confirm-enrollment" hidden>
      <label>認証アプリへ登録するキー<input id="enrollment-key" readonly></label>
      <label>認証アプリのコード<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label>
      <button type="submit">二段階認証を登録</button>
    </form>
  </section>
  <p id="connection" role="status"></p>
  <section id="workspace" hidden>
    <div class="workspace-sidebar">
    <nav id="nav" aria-label="財務管理">
      <button type="button" data-page="home">ホーム</button>
      <button type="button" data-page="schedule">日程</button>
      <button type="button" data-page="estimates">見積履歴</button>
      <button type="button" data-page="documents">帳票</button>
      <button type="button" data-page="history">保存帳票</button>
      <button type="button" data-page="sales">売上・入金</button>
      <button type="button" data-page="expenses">支出・現金</button>
      <button type="button" data-page="bank">銀行照合</button>
      <button type="button" data-page="settings">設定</button>
    </nav>
    </div>
    <div class="workspace-body">
    <section id="status" role="status" aria-live="polite"></section>
    <section id="page"></section>
    </div>
  </section>
</main>
<script src="/src/core/document-numbering.js"></script>
<script src="/src/core/business.js"></script>
<script src="/src/core/schedule-calendar.js"></script>
<script src="/src/core/views.js"></script>
<script src="/src/core/document-totals.js"></script>
<script src="/app/acceptance.js"></script>
<script src="/app/workbench.js"></script>
</body>
</html>
