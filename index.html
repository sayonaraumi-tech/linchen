}

const f=state.bankFilter,rows=banks.filter(x=>f==="すべて"||(f==="未照合"?x.status!=="照合済":x.status==="照合済"));let x=banks[state.bankId];
return '<section class="panel"><p class="muted">口座：法人銀行口座　｜　期間：2026年11月</p><div class="summary" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+metric("取込明細","4件")+metric("未照合","3件")+metric("照合済","1件")+'</div></section><div class="row" style="margin-bottom:14px">'+["すべて","未照合","照合済"].map(t=>button(t,"bank-filter:"+t,t===f?"dark":"")) .join("")+'</div>'+
'<section class="panel"><h2>銀行明細一覧</h2>'+table(["日付","摘要","金額","状態"],rows.map(r=>'<tr class="bankrow '+(r.id===state.bankId?'selected':'')+'" data-bank="'+r.id+'">'+td(esc(r.date))+td(esc(r.desc))+td((r.sum>0?"+":"")+amounts(r.sum),"num "+(r.sum>0?"positive":""))+td('<span class="status '+(r.status==="照合済"?"ok":"")+'">'+esc(r.status)+'</span>')+'</tr>'))+'</section><div class="grid2"><section class="panel"><h2>選択明細</h2><p class="muted">'+esc(x.date)+'　'+(x.sum>0?"入金":"出金")+'</p><h2>'+esc(x.desc)+'</h2><h2>'+yen(Math.abs(x.sum))+'</h2></section><section class="panel"><h2>照合候補・処理</h2><p class="muted">'+(x.candidate?"全額一致候補":"候補なし")+'</p><p>'+esc(x.candidate||"一致する取引が見つかりません")+'</p><div class="warn">既存記録との関連付け / 科目確認 / 新規補録</div><div class="actions" style="margin-top:14px">'+button("既存記録に関連付け","demo","small")+button("科目を確認","demo","small")+button("新規補録","demo","small")+'</div></section></div><p class="muted tiny">正式版では銀行CSVと既存取引の重複防止・金額照合・確認済状態をバックエンドで保証する必要があります。</p>';
}
function settings(){
let t=state.tab||"会社情報";return tabs(["会社情報","帳票設定","番号ルール","分類マスター","ユーザー"],t)+
'<section class="panel"><div class="two"><div><h2>'+esc(t)+'</h2><div class="stack">'+control("会社名","月輪合同会社")+control("郵便番号","")+control("住所","")+control("電話番号","")+control("メール","")+control("登録番号（インボイス）","")+'</div></div><div><h2>帳票への表示（プレビュー）</h2><div class="preview" style="min-height:250px"><div class="pdfSheet" style="min-height:215px"><h2 style="font-size:20px;margin:20px">月輪合同会社</h2><p class="muted">会社情報は未接続です。架空の住所や登録番号は表示しません。</p></div></div></div></div><div class="row" style="margin-top:16px">'+button("保存（デモ）","demo","gold")+'</div></section>';
}
const renderers=[home,calendar,estimates,doc,archive,sales,expenses,bank,settings];
function render(){
document.getElementById("navigation").innerHTML=names.map((n,i)=>'<button data-page="'+i+'" class="'+(state.page===i?'active':'')+'">'+esc(n)+'</button>').join("");
document.getElementById("pageTitle").textContent=names[state.page];document.getElementById("topActions").innerHTML=headActions();document.getElementById("content").innerHTML=renderers[state.page]();
}
function toast(msg){let old=document.getElementById("toast");if(old)old.remove();let t=document.createElement("div");t.id="toast";t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
function action(a){
if(a==="demo"||a==="csv"||a==="new-event")return toast("デモ画面：正式なデータ保存・CSV取込・PDF生成は行いません。");
if(a==="go-doc"){state.page=3;state.tab="";return render()}
if(a==="prev-month"){state.month--;if(state.month<0){state.month=11;state.year--}return render()}
if(a==="next-month"){state.month++;if(state.month>11){state.month=0;state.year++}return render()}
if(a.startsWith("day:")){state.day=Number(a.split(":")[1]);return render()}
if(a.startsWith("bank-filter:")){state.bankFilter=a.slice(12);return render()}
if(a==="add-item"){state.items.push({name:"",qty:1,unit:"式",price:0});return render()}
if(a.startsWith("remove-item:")){state.items.splice(Number(a.slice(12)),1);return render()}
if(a==="search"){state.query=document.getElementById("search")?.value||"";return render()}
if(a==="refresh")return render();
}
document.addEventListener("click",e=>{
const p=e.target.closest("[data-page]");if(p){state.page=Number(p.dataset.page);state.tab="";state.query="";render();return}
const t=e.target.closest("[data-tab]");if(t){let v=t.dataset.tab;if(state.page===3)state.docType=v;else state.tab=v;render();return}
const b=e.target.closest("[data-bank]");if(b){state.bankId=Number(b.dataset.bank);render();return}
const a=e.target.closest("[data-action]");if(a)action(a.dataset.action);
});
document.addEventListener("change",e=>{const a=e.target.dataset.item;if(a){const [i,k]=a.split(":");state.items[Number(i)][k]=["qty","price"].includes(k)?Number(e.target.value):e.target.value;render()}});
render();
</script></body></html>
